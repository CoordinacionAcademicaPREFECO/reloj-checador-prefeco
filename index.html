<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reloj Checador - PREFECO 2/18</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #0b2345;
    }

    .contenedor {
      width: 92%;
      max-width: 650px;
      background: white;
      border-radius: 25px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.15);
    }

    h1 {
      margin-bottom: 5px;
      color: #0b2345;
    }

    h2 {
      font-weight: normal;
      margin-top: 5px;
    }

    label {
      display: block;
      margin-top: 25px;
      margin-bottom: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    #token {
      width: 90%;
      max-width: 400px;
      padding: 14px;
      font-size: 18px;
      border: 2px solid #0b2345;
      border-radius: 10px;
      text-align: center;
      box-sizing: border-box;
    }

    #camara {
      width: 100%;
      max-width: 500px;
      margin: 25px auto 10px;
      border-radius: 15px;
      overflow: hidden;
      background: #222;
    }

    #video {
      width: 100%;
      display: block;
    }

    #foto {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      border-radius: 15px;
      display: none;
    }

    #resultado {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      min-height: 70px;
    }

    .exito {
      color: #147a35;
    }

    .espera {
      color: #0b2345;
    }

    .error {
      color: #a51d2d;
    }

    .boton {
      display: inline-block;
      padding: 15px 25px;
      border: none;
      border-radius: 12px;
      background: #0b2345;
      color: white;
      font-size: 18px;
      cursor: pointer;
      margin: 8px;
    }

    .boton:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #canvas {
      display: none;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>PREFECO 2/18 HALCONES</h1>

    <h2>Capacitación Docente 2026</h2>

    <label for="token">
      Token del docente
    </label>

    <input
      type="text"
      id="token"
      placeholder="Escribe tu token"
      autocomplete="off"
    >

    <div id="camara">

      <video
        id="video"
        autoplay
        playsinline>
      </video>

    </div>

    <canvas id="canvas"></canvas>

    <img
      id="foto"
      alt="Fotografía del docente"
    >

    <div>

      <button
        id="botonFoto"
        class="boton"
        onclick="tomarFotografia()"
        disabled>
        📷 Tomar fotografía
      </button>

      <button
        id="botonRegistrar"
        class="boton"
        onclick="registrarAsistencia()"
        disabled>
        ✅ Registrar asistencia
      </button>

    </div>

    <div
      id="resultado"
      class="espera">

      📷 Preparando cámara...

    </div>

  </div>


<script>

  /*************************************************
   * CONFIGURACIÓN
   *************************************************/

  const URL_APPS_SCRIPT =
    'https://script.google.com/macros/s/AKfycbzRnC-K4tNU5todhu0QZVC3ryHVdG-8bc3UaYXJzLFZr3kT22Rry8yWp5x_vHVlZ9QJ/exec';


  /*************************************************
   * VARIABLES
   *************************************************/

  let flujoCamara = null;
  let fotografiaTomada = false;
  let procesando = false;


  /*************************************************
   * INICIAR CÁMARA
   *************************************************/

  async function iniciarCamara() {

    const video =
      document.getElementById('video');

    const resultado =
      document.getElementById('resultado');

    try {

      flujoCamara =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: "user"
          },

          audio: false

        });

      video.srcObject = flujoCamara;

      resultado.innerHTML =
        '📷 Coloca tu rostro frente a la cámara.';

      document.getElementById('botonFoto').disabled =
        false;

    }

    catch (error) {

      console.error(error);

      resultado.innerHTML =
        '<div class="error">' +
        '❌ No fue posible iniciar la cámara.<br><br>' +
        'Verifica que hayas permitido el acceso a la cámara.' +
        '</div>';

    }

  }


  /*************************************************
   * TOMAR FOTOGRAFÍA
   *************************************************/

  function tomarFotografia() {

    const video =
      document.getElementById('video');

    const canvas =
      document.getElementById('canvas');

    const foto =
      document.getElementById('foto');

    const resultado =
      document.getElementById('resultado');

    const token =
      document.getElementById('token').value.trim();


    if (token === '') {

      resultado.innerHTML =
        '<div class="error">' +
        '❌ Primero escribe el token del docente.' +
        '</div>';

      document.getElementById('token').focus();

      return;
    }


    if (!video.videoWidth || !video.videoHeight) {

      resultado.innerHTML =
        '<div class="error">' +
        '❌ La cámara todavía no está lista.' +
        '</div>';

      return;
    }


    canvas.width =
      video.videoWidth;

    canvas.height =
      video.videoHeight;


    const contexto =
      canvas.getContext('2d');


    contexto.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    const imagen =
      canvas.toDataURL(
        'image/jpeg',
        0.80
      );


    foto.src = imagen;

    foto.style.display =
      'block';


    fotografiaTomada =
      true;


    document.getElementById('botonRegistrar').disabled =
      false;


    resultado.innerHTML =
      '<div class="espera">' +
      '✅ Fotografía tomada correctamente.<br>' +
      'Revisa la imagen y pulsa "Registrar asistencia".' +
      '</div>';

  }


  /*************************************************
   * REGISTRAR ASISTENCIA
   *************************************************/

  function registrarAsistencia() {

    if (procesando) return;


    const token =
      document.getElementById('token').value.trim();


    const resultado =
      document.getElementById('resultado');


    if (token === '') {

      resultado.innerHTML =
        '<div class="error">' +
        '❌ Escribe el token del docente.' +
        '</div>';

      return;
    }


    if (!fotografiaTomada) {

      resultado.innerHTML =
        '<div class="error">' +
        '❌ Primero toma la fotografía del docente.' +
        '</div>';

      return;
    }


    procesando = true;


    resultado.innerHTML =
      '<div class="espera">' +
      '⏳ Registrando asistencia...' +
      '</div>';


    /*
     * POR AHORA:
     *
     * Utilizamos la misma comunicación JSONP
     * que ya comprobamos que funciona.
     *
     * En la siguiente etapa agregaremos el envío
     * de la fotografía a Apps Script.
     */


    const callback =
      'respuestaAsistencia_' + Date.now();


    window[callback] =
      function(respuesta) {

        console.log(
          'Respuesta de Apps Script:',
          respuesta
        );


if (respuesta.ok) {

  resultado.innerHTML =
    '<div class="exito">' +
    '✅ ' + respuesta.mensaje +
    '<br><br>' +
    '<strong>' +
    respuesta.nombre +
    '</strong>' +
    '<br>' +
    respuesta.hora +
    '<br><br>' +
    '📷 Registro realizado correctamente.' +
    '</div>';

  // Enviar la fotografía sin cambiar el mensaje de pantalla
  enviarFotografia(token);

  // Recargar la pantalla después de 6 segundos
  setTimeout(function() {
    location.reload();
  }, 6000);

}
        else {

  resultado.innerHTML =
    '<div class="error">' +
    '❌ ' +
    respuesta.mensaje +
    '<br><br>' +
    '📋 Preparando el siguiente registro...' +
    '</div>';

  // Recargar también cuando el docente
  // ya tiene entrada y salida registradas
  setTimeout(function() {
    location.reload();
  }, 6000);

}


    const script =
      document.createElement('script');


    script.src =
      URL_APPS_SCRIPT +
      '?callback=' +
      encodeURIComponent(callback) +
      '&token=' +
      encodeURIComponent(token);


    script.onerror =
      function() {

        console.error(
          'No se pudo cargar la respuesta de Apps Script.'
        );


        resultado.innerHTML =
          '<div class="error">' +
          '❌ No fue posible comunicarse con el sistema de asistencia.' +
          '</div>';


        delete window[callback];

        procesando = false;

      };


    document.body.appendChild(script);

  }

/*************************************************
 * ENVIAR FOTOGRAFÍA A APPS SCRIPT
 *************************************************/

function enviarFotografia(token) {

  const foto =
    document.getElementById('foto');

  const resultado =
    document.getElementById('resultado');


  if (!foto.src) {

    resultado.innerHTML +=
      '<br><span class="error">' +
      '❌ No se encontró la fotografía.' +
      '</span>';

    return;
  }


  /*
   * Preparar los datos para enviar mediante POST.
   */

  const datos =
    new URLSearchParams();

  datos.append(
    'token',
    token
  );

  datos.append(
    'fotografia',
    foto.src
  );


  /*
   * Enviar a Google Apps Script.
   *
   * no-cors permite realizar el envío
   * desde GitHub Pages sin bloquear la petición
   * por CORS.
   */

  fetch(
    URL_APPS_SCRIPT,
    {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type':
          'application/x-www-form-urlencoded;charset=UTF-8'
      },
      body: datos.toString()
    }
  )
  .then(function() {

  console.log(
    'Fotografía enviada a Apps Script.'
  );

  // No cambiar el mensaje que está viendo el docente.
  // La pantalla se recargará mediante el temporizador
  // de registrarAsistencia().

})
  .catch(function(error) {

    console.error(
      'Error al enviar fotografía:',
      error
    );


    resultado.innerHTML +=
      '<br><span class="error">' +
      '⚠️ La asistencia fue registrada, ' +
      'pero hubo un problema al enviar la fotografía.' +
      '</span>';

  });

}
  
  /*************************************************
   * INICIAR AUTOMÁTICAMENTE
   *************************************************/

  iniciarCamara();

</script>

</body>
</html>
