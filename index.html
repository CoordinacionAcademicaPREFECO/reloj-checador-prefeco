<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lector QR - PREFECO 2/18</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #0b2345;
    }

    .contenedor {
      width: 92%;
      max-width: 650px;
      background: white;
      border-radius: 25px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.15);
    }

    h1 {
      margin-bottom: 5px;
      color: #0b2345;
    }

    h2 {
      font-weight: normal;
      margin-top: 5px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 25px auto;
    }

    #resultado {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      min-height: 80px;
    }

    .exito {
      color: #147a35;
    }

    .espera {
      color: #0b2345;
    }

    .error {
      color: #a51d2d;
    }

    .boton {
      display: inline-block;
      padding: 15px 25px;
      border: none;
      border-radius: 12px;
      background: #0b2345;
      color: white;
      font-size: 18px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>PREFECO 2/18 HALCONES</h1>

    <h2>Capacitación Docente 2026</h2>

    <p>
      Acerca el código QR personal a la cámara.
    </p>

    <div id="reader"></div>

    <div id="resultado" class="espera">
      📷 Preparando cámara...
    </div>

    <button
      id="botonReiniciar"
      class="boton"
      onclick="reiniciarCamara()"
      style="display:none;">
      📷 Escanear otro QR
    </button>

  </div>

<script>

  /*************************************************
   * CONFIGURACIÓN
   *************************************************/

  const URL_APPS_SCRIPT =
    'https://script.google.com/macros/s/AKfycbzRnC-K4tNU5todhu0QZVC3ryHVdG-8bc3UaYXJzLFZr3kT22Rry8yWp5x_vHVlZ9QJ/exec';


  let lector = null;
  let procesando = false;


  /*************************************************
   * INICIAR CÁMARA
   *************************************************/

  function iniciarCamara() {

    procesando = false;

    document.getElementById('botonReiniciar').style.display = 'none';

    document.getElementById('resultado').innerHTML =
      '📷 Apunta la cámara al código QR';

    lector = new Html5Qrcode("reader");

    const configuracion = {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    };

    lector.start(
      {
        facingMode: "environment"
      },
      configuracion,
      cuandoLeeQR,
      function(errorMessage) {
        // Los errores normales de búsqueda se ignoran.
      }
    )
    .catch(function(error) {

      document.getElementById('resultado').innerHTML =
        '<div class="error">' +
        '❌ No fue posible iniciar la cámara.<br><br>' +
        'Error: ' + error.name +
        '<br>' +
        error.message +
        '</div>';

      console.error(error);
    });
  }


  /*************************************************
   * CUANDO SE DETECTA UN QR
   *************************************************/

  function cuandoLeeQR(texto) {

  if (procesando) return;

  procesando = true;

  const resultado = document.getElementById('resultado');

  resultado.innerHTML =
    '<div class="espera">' +
    '⏳ Código detectado.<br><br>' +
    'Registrando asistencia...' +
    '</div>';

  detenerCamara();

  // Nombre único para recibir la respuesta
  const callback = 'respuestaQR_' + Date.now();

  // Crear la función que Apps Script va a llamar
  window[callback] = function(respuesta) {

    console.log('Respuesta de Apps Script:', respuesta);

    if (respuesta.ok) {

      resultado.innerHTML =
        '<div class="exito">' +
        '✅ ' + respuesta.mensaje +
        '<br><br>' +
        '<strong>' + respuesta.nombre + '</strong>' +
        '<br>' +
        respuesta.hora +
        '</div>';

    } else {

      resultado.innerHTML =
        '<div class="error">' +
        '❌ ' + respuesta.mensaje +
        '</div>';
    }

    // Eliminar el callback después de recibir la respuesta
    delete window[callback];

    // Mostrar botón para volver a escanear
    document.getElementById('botonReiniciar').style.display =
      'inline-block';

  };

  // Crear una etiqueta SCRIPT.
  // Esto evita el problema CORS de fetch().
  const script = document.createElement('script');

  script.src =
    URL_APPS_SCRIPT +
    '?callback=' +
    encodeURIComponent(callback) +
    '&token=' +
    encodeURIComponent(texto);

  script.onerror = function() {

    console.error('No se pudo cargar la respuesta de Apps Script.');

    resultado.innerHTML =
      '<div class="error">' +
      '❌ No fue posible comunicarse con el sistema de asistencia.' +
      '</div>';

    delete window[callback];

    document.getElementById('botonReiniciar').style.display =
      'inline-block';
  };

  document.body.appendChild(script);
}

  /*************************************************
   * DETENER CÁMARA
   *************************************************/

  function detenerCamara() {

    if (!lector) return;

    lector.stop()
      .then(function() {

        lector.clear();

      })
      .catch(function(error) {

        console.error(
          'Error al detener la cámara:',
          error
        );

      });
  }


  /*************************************************
   * REINICIAR CÁMARA
   *************************************************/

  function reiniciarCamara() {

    document.getElementById('reader').innerHTML = '';

    iniciarCamara();
  }


  /*************************************************
   * INICIAR AUTOMÁTICAMENTE
   *************************************************/

  iniciarCamara();

</script>

</body>
</html>
